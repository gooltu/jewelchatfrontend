# G14: 15 messages from three members sent in quick succession all arrive once.
appId: net.jewelchat.app
name: G14
tags: [group, edge]
---
- launchApp: { stopApp: false }
- runScript:
    file: ../scripts/bot.js
    env: { ACTION: reset }
- runScript:
    file: ../scripts/bot.js
    env: { ACTION: group-create, BOT: "${BOT1}", KEY: busy, NAME: "Busy ${output.runId}", MEMBERS: "device,${BOT2},${BOT3}" }
- runScript:
    file: ../scripts/bot.js
    env: { ACTION: reset }
- runScript:
    file: ../scripts/bot.js
    env: { ACTION: group-burst, BOT: "${BOT1}", ROOM: "@busy", COUNT: "5", TEXT: "A ${output.runId}" }
- runScript:
    file: ../scripts/bot.js
    env: { ACTION: group-burst, BOT: "${BOT2}", ROOM: "@busy", COUNT: "5", TEXT: "B ${output.runId}" }
- runScript:
    file: ../scripts/bot.js
    env: { ACTION: group-burst, BOT: "${BOT3}", ROOM: "@busy", COUNT: "5", TEXT: "C ${output.runId}" }
- runFlow: ../subflows/to-chat-list.yaml
- extendedWaitUntil:
    visible: { id: "chat-list.row.${output.rooms.busy.node}" }
    timeout: 30000
- tapOn: { id: "chat-list.row.${output.rooms.busy.node}" }
- extendedWaitUntil:
    visible: { text: "C ${output.runId} 5" }
    timeout: 30000
- assertNotVisible: { text: "C ${output.runId} 5", index: 1 }
- scrollUntilVisible:
    element: { text: "B ${output.runId} 5" }
    direction: UP
    timeout: 15000
- assertNotVisible: { text: "B ${output.runId} 5", index: 1 }
- scrollUntilVisible:
    element: { text: "A ${output.runId} 1" }
    direction: UP
    timeout: 15000

# G12: group messages sent while the device is offline (Android) or in the
# background (both platforms) all show when it's back.
appId: net.jewelchat.app
name: G12
tags: [group, edge]
---
- launchApp: { stopApp: false }
- runScript:
    file: ../scripts/bot.js
    env: { ACTION: reset }
- runFlow: ../subflows/to-chat-list.yaml
- extendedWaitUntil:
    visible: { id: "chat-list.row.${output.rooms.main.node}" }
    timeout: 30000
- tapOn: { id: "chat-list.row.${output.rooms.main.node}" }
- extendedWaitUntil:
    visible: { id: "chat-detail.composer.input" }
    timeout: 15000
- runFlow:
    when: { platform: Android }
    commands:
      - setAirplaneMode: enabled
      - waitForAnimationToEnd: { timeout: 3000 }
      - runScript:
          file: ../scripts/bot.js
          env: { ACTION: group-send, BOT: "${BOT1}", ROOM: "@main", TEXT: "While offline ${output.runId}" }
      - setAirplaneMode: disabled
      - extendedWaitUntil:
          visible: { text: "While offline ${output.runId}" }
          timeout: 60000
- pressKey: Home
- waitForAnimationToEnd: { timeout: 3000 }
- runScript:
    file: ../scripts/bot.js
    env: { ACTION: group-send, BOT: "${BOT1}", ROOM: "@main", TEXT: "While away 1 ${output.runId}" }
- runScript:
    file: ../scripts/bot.js
    env: { ACTION: group-send, BOT: "${S1}", ROOM: "@main", TEXT: "While away 2 ${output.runId}" }
- launchApp: { stopApp: false }
- extendedWaitUntil:
    visible: { text: "While away 2 ${output.runId}" }
    timeout: 45000
- assertVisible:
    text: "While away 1 ${output.runId}"
    above: { text: "While away 2 ${output.runId}" }

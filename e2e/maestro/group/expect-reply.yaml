# Group suite step: in the open chat, reply ${TEXT} arrives showing a quote of
# ${QUOTE} (resolved to this device's own copy of the quoted message).
appId: net.jewelchat.app
---
- runFlow: ../subflows/dismiss-logbox.yaml
- extendedWaitUntil:
    visible:
      id: "chat-detail\\.message\\..*\\.text"
      text: ${TEXT}
    timeout: 30000
# The quote block exists, and the quoted text shows twice: once in the
# original bubble, once in the quote. (Android flattens the quote's View, so
# its texts aren't descendants of `<bubble>.quote` in Maestro's tree.)
- assertVisible:
    id: "chat-detail\\.message\\..*\\.quote"
- assertVisible:
    text: ${QUOTE}
    index: 1

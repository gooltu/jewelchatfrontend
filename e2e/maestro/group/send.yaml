# Group suite step: in the open chat, send ${TEXT}.
appId: net.jewelchat.app
---
- runFlow: ../subflows/dismiss-logbox.yaml
- tapOn:
    id: "chat-detail.composer.input"
- inputText: ${TEXT}
- tapOn:
    id: "chat-detail.composer.send"
- extendedWaitUntil:
    visible:
      id: "chat-detail\\.message\\..*\\.text"
      text: ${TEXT}
    timeout: 10000
